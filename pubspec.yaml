name: raspisanie_app
description: "Professional KHAMK schedule app with automated substitutions parsing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Logic & State
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  rxdart: ^0.27.7
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Storage
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0

  # Network & Parsing
  dio: ^5.4.1
  html: ^0.15.4
  xml: ^6.5.0
  archive: ^3.4.10

  # DI
  get_it: ^7.6.7
  injectable: ^2.3.2

  # UI
  skeletonizer: ^2.1.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/base_schedule.json
