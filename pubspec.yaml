name: raspisanie_app
description: "Расписание занятий с автоматическим подтягиванием замен."
publish_to: 'none'
version: 1.3.1+10

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Logic & State
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  rxdart: ^0.27.7
  dartz: ^0.10.1
  equatable: ^2.0.5
  collection: ^1.18.0

  # Storage
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Network & Parsing
  dio: ^5.4.1
  html: ^0.15.4
  xml: ^6.5.0
  archive: ^3.4.10

  # Files
  file_picker: ^8.0.0

  # DI
  get_it: ^7.6.7

  # UI
  google_fonts: ^6.1.0
  # 1.9.0 использует kotlin { compilerOptions } без плагина kotlin-android
  # и не собирается под Android — держим версию ниже.
  dynamic_color: '>=1.7.0 <1.9.0'
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.9
  crypto: ^3.0.7
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  # Источник уже содержит собственную белую подложку-скруглённый квадрат
  # с прозрачными углами — используем его и как обычную иконку,
  # и как foreground adaptive icon с тем же белым фоном.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 24
